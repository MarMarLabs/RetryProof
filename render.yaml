services:
  - type: web
    name: retryproof
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/ready
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: retryproof-db
          property: connectionString
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: DEMO_MODEL_MODE
        value: cached
      - key: CODEX_REPAIR_MODE
        value: cached
      - key: OPENAI_ANALYSIS_MODEL
        value: gpt-5.6-sol
      - key: CODEX_MODEL
        value: gpt-5.6-sol

databases:
  - name: retryproof-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: retryproof
    user: retryproof
